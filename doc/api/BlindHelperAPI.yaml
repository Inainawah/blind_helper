openapi: 3.0.3
info:
  title: Blind Helper RESTful API
  version: 1.0.0
  description: |
    本文件定義 Blind Helper 視障輔助 Android App 與後端伺服器之間的 RESTful API。
    系統功能包含使用者管理、JWT Authentication、定位紀錄、導航紀錄、緊急求助、
    相機/物件辨識紀錄、語音指令紀錄與資料庫 Schema 對應。

servers:
  - url: http://localhost:3000/api
    description: Local Development Server
  - url: https://api.blindhelper.com/api
    description: Production Server Example

tags:
  - name: Authentication
    description: JWT 登入驗證與 Token 管理
  - name: Users
    description: 使用者資料管理
  - name: Location
    description: GPS 定位與地址紀錄
  - name: Navigation
    description: 導航路徑紀錄
  - name: Emergency
    description: 緊急求助與聯絡紀錄
  - name: Camera Detection
    description: 相機與物件辨識紀錄
  - name: Voice
    description: 語音指令與語音回饋紀錄

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: 使用者註冊 Register
      description: 建立新的使用者帳號。密碼在後端需以雜湊方式儲存，不可明文存放。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: 王小明
              email: user@example.com
              password: "12345678"
              phone: "0912345678"
      responses:
        "201":
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              example:
                success: true
                message: Register successfully
                token: jwt_token
                user:
                  user_id: 1
                  name: 王小明
                  email: user@example.com
                  phone: "0912345678"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email 已被註冊
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email already exists
                error_code: EMAIL_ALREADY_EXISTS
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: 使用者登入 Login
      description: 使用 Email 與 Password 登入，成功後回傳 JWT Token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: "12345678"
      responses:
        "200":
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              example:
                success: true
                message: Login successfully
                token: jwt_token
                user:
                  user_id: 1
                  name: 王小明
                  email: user@example.com
                  phone: "0912345678"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: 使用者登出 Logout
      description: 使用者登出。若後端有 Token blacklist，可在此 API 將 Token 失效。
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Logout successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{user_id}:
    get:
      tags: [Users]
      summary: 取得使用者資料 Get User
      description: 取得指定使用者基本資料。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                data:
                  user_id: 1
                  name: 王小明
                  email: user@example.com
                  phone: "0912345678"
                  created_at: "2026-06-26 10:00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: 更新使用者資料 Update User
      description: 更新使用者姓名、電話或其他基本資料。
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              name: 王小明
              phone: "0987654321"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: User updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/preferences:
    get:
      tags: [Users]
      summary: 取得使用者偏好設定
      description: 取得使用者語音速度、導航模式、音效與震動等設定。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
              example:
                success: true
                data:
                  preference_id: 1
                  user_id: 1
                  voice_speed: normal
                  navigation_mode: walking
                  vibration_enabled: true
                  sound_enabled: true
                  obstacle_alert_distance: 3
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Users]
      summary: 更新使用者偏好設定
      description: 更新語音、導航、提醒距離等 App 設定。
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
            example:
              voice_speed: normal
              navigation_mode: walking
              vibration_enabled: true
              sound_enabled: true
              obstacle_alert_distance: 3
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Preferences updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /locations:
    post:
      tags: [Location]
      summary: 上傳 GPS 定位紀錄
      description: App 上傳目前 GPS 座標、定位精準度與地址資訊。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
            example:
              user_id: 1
              latitude: 25.033964
              longitude: 121.564468
              accuracy: 3.5
              address: 台北市信義區市府路
      responses:
        "201":
          description: 新增定位紀錄成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLocationResponse"
              example:
                success: true
                message: Location created successfully
                location_id: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /locations/user/{user_id}:
    get:
      tags: [Location]
      summary: 查詢使用者定位紀錄
      description: 查詢指定使用者的歷史 GPS 定位資料。
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: 回傳筆數限制
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
              example:
                success: true
                data:
                  - location_id: 1
                    user_id: 1
                    latitude: 25.033964
                    longitude: 121.564468
                    accuracy: 3.5
                    address: 台北市信義區市府路
                    created_at: "2026-06-26 10:20:00"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /navigation-records:
    post:
      tags: [Navigation]
      summary: 新增導航紀錄
      description: 儲存一次導航的起點、終點、距離、時間與路線摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNavigationRequest"
            example:
              user_id: 1
              start_address: 淡江大學
              end_address: 捷運淡水站
              start_latitude: 25.175000
              start_longitude: 121.449000
              end_latitude: 25.168000
              end_longitude: 121.445000
              distance_meters: 1200
              duration_seconds: 900
              route_summary: 步行約 15 分鐘
      responses:
        "201":
          description: 新增導航紀錄成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNavigationResponse"
              example:
                success: true
                message: Navigation record created successfully
                navigation_id: 1
        "400":
          $ref: "#/components/responses/BadRequest"

  /navigation-records/user/{user_id}:
    get:
      tags: [Navigation]
      summary: 查詢使用者導航紀錄
      description: 查詢指定使用者的歷史導航路線紀錄。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationListResponse"
              example:
                success: true
                data:
                  - navigation_id: 1
                    user_id: 1
                    start_address: 淡江大學
                    end_address: 捷運淡水站
                    distance_meters: 1200
                    duration_seconds: 900
                    route_summary: 步行約 15 分鐘
                    created_at: "2026-06-26 10:30:00"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /navigation-records/{navigation_id}:
    delete:
      tags: [Navigation]
      summary: 刪除導航紀錄
      description: 刪除指定導航紀錄。
      parameters:
        - $ref: "#/components/parameters/NavigationId"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Navigation record deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /emergency-contacts:
    post:
      tags: [Emergency]
      summary: 新增緊急聯絡人
      description: 新增使用者的緊急聯絡人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmergencyContactRequest"
            example:
              user_id: 1
              contact_name: 王媽媽
              phone: "0912345678"
              relationship: 母親
      responses:
        "201":
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEmergencyContactResponse"
              example:
                success: true
                message: Emergency contact created successfully
                contact_id: 1
        "400":
          $ref: "#/components/responses/BadRequest"

  /emergency-contacts/user/{user_id}:
    get:
      tags: [Emergency]
      summary: 查詢緊急聯絡人
      description: 查詢指定使用者的緊急聯絡人清單。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyContactListResponse"
              example:
                success: true
                data:
                  - contact_id: 1
                    user_id: 1
                    contact_name: 王媽媽
                    phone: "0912345678"
                    relationship: 母親
                    created_at: "2026-06-26 10:00:00"

  /emergency-contacts/{contact_id}:
    put:
      tags: [Emergency]
      summary: 更新緊急聯絡人
      description: 修改緊急聯絡人資料。
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmergencyContactRequest"
            example:
              contact_name: 王媽媽
              phone: "0987654321"
              relationship: 母親
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Emergency contact updated successfully

    delete:
      tags: [Emergency]
      summary: 刪除緊急聯絡人
      description: 刪除指定緊急聯絡人。
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Emergency contact deleted successfully

  /emergency-logs:
    post:
      tags: [Emergency]
      summary: 新增緊急求助紀錄
      description: 使用者觸發 SOS 或緊急求助時，儲存當下位置、訊息與狀態。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmergencyLogRequest"
            example:
              user_id: 1
              contact_id: 1
              latitude: 25.033964
              longitude: 121.564468
              address: 台北市信義區市府路
              message: 使用者需要協助
              status: pending
      responses:
        "201":
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEmergencyLogResponse"
              example:
                success: true
                message: Emergency log created successfully
                emergency_log_id: 1

  /emergency-logs/user/{user_id}:
    get:
      tags: [Emergency]
      summary: 查詢緊急求助紀錄
      description: 查詢指定使用者的緊急求助紀錄。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyLogListResponse"

  /camera/detections:
    post:
      tags: [Camera Detection]
      summary: 新增相機/物件辨識紀錄
      description: 儲存 YOLO 或相機模型辨識到的物件，例如人、車、障礙物、紅綠燈等。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDetectionRequest"
            example:
              user_id: 1
              object_name: car
              confidence: 0.91
              description: 前方偵測到車輛
              image_url: https://storage.example.com/image001.jpg
              latitude: 25.033964
              longitude: 121.564468
      responses:
        "201":
          description: 新增辨識紀錄成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDetectionResponse"
              example:
                success: true
                message: Detection record created successfully
                detection_id: 1
        "400":
          $ref: "#/components/responses/BadRequest"

  /camera/detections/user/{user_id}:
    get:
      tags: [Camera Detection]
      summary: 查詢物件辨識紀錄
      description: 查詢指定使用者的歷史物件辨識紀錄。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionListResponse"
              example:
                success: true
                data:
                  - detection_id: 1
                    user_id: 1
                    object_name: car
                    confidence: 0.91
                    description: 前方偵測到車輛
                    image_url: https://storage.example.com/image001.jpg
                    created_at: "2026-06-26 10:40:00"

  /camera/detections/{detection_id}:
    delete:
      tags: [Camera Detection]
      summary: 刪除物件辨識紀錄
      description: 刪除指定辨識紀錄。
      parameters:
        - $ref: "#/components/parameters/DetectionId"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Detection record deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /voice/commands:
    post:
      tags: [Voice]
      summary: 新增語音指令紀錄
      description: 儲存使用者語音指令轉文字後的內容與解析結果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceCommandRequest"
            example:
              user_id: 1
              command_text: 帶我去捷運站
              intent: navigation
              response_text: 已為您規劃前往捷運站的路線
      responses:
        "201":
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVoiceCommandResponse"
              example:
                success: true
                message: Voice command created successfully
                voice_command_id: 1

  /voice/commands/user/{user_id}:
    get:
      tags: [Voice]
      summary: 查詢語音指令紀錄
      description: 查詢指定使用者的語音指令歷史紀錄。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCommandListResponse"
              example:
                success: true
                data:
                  - voice_command_id: 1
                    user_id: 1
                    command_text: 帶我去捷運站
                    intent: navigation
                    response_text: 已為您規劃前往捷運站的路線
                    created_at: "2026-06-26 10:55:00"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    NavigationId:
      name: navigation_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    DetectionId:
      name: detection_id
      in: path
      required: true
      schema:
        type: integer
      example: 1

  responses:
    BadRequest:
      description: 請求資料格式錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Invalid request body
            error_code: BAD_REQUEST
    Unauthorized:
      description: 未授權或 Token 無效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Unauthorized
            error_code: UNAUTHORIZED
    NotFound:
      description: 找不到指定資料
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Resource not found
            error_code: NOT_FOUND
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Internal server error
            error_code: INTERNAL_SERVER_ERROR

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error_code:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        user_id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        created_at:
          type: string

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/User"

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    UpdatePreferencesRequest:
      type: object
      properties:
        voice_speed:
          type: string
          enum: [slow, normal, fast]
        navigation_mode:
          type: string
          enum: [walking, indoor, outdoor]
        vibration_enabled:
          type: boolean
        sound_enabled:
          type: boolean
        obstacle_alert_distance:
          type: integer

    UserPreferences:
      type: object
      properties:
        preference_id:
          type: integer
        user_id:
          type: integer
        voice_speed:
          type: string
        navigation_mode:
          type: string
        vibration_enabled:
          type: boolean
        sound_enabled:
          type: boolean
        obstacle_alert_distance:
          type: integer

    UserPreferencesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserPreferences"

    CreateLocationRequest:
      type: object
      required: [user_id, latitude, longitude]
      properties:
        user_id:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
        address:
          type: string

    CreateLocationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        location_id:
          type: integer

    Location:
      type: object
      properties:
        location_id:
          type: integer
